# ═══════════════════════════════════════════════════
#  SoundRip — application.properties
# ═══════════════════════════════════════════════════

# Server
server.port=8080
spring.application.name=soundrip

# ── File upload limits ───────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=505MB

# ── SoundRip custom config ───────────────────────
# Temp directory for uploads and converted files
soundrip.temp-dir=${java.io.tmpdir}/soundrip

# Path to the ffmpeg binary.
# If ffmpeg is on your PATH you can leave this as "ffmpeg".
# Otherwise set the absolute path, e.g. /usr/local/bin/ffmpeg
soundrip.ffmpeg.path=ffmpeg

# ── Logging ──────────────────────────────────────
logging.level.io.soundrip=INFO
# Set to DEBUG to see full FFmpeg output:
# logging.level.io.soundrip=DEBUG
